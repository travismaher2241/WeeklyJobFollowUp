services:
  - type: web
    name: plasgain-job-followup
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        sync: false
